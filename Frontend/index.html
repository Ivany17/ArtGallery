<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Digital Museum</title> 
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <h1>Art Gallery</h1>
    <form id="artForm">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="artist" placeholder="Artist" required>
        <input type="number" id="year" placeholder="Year" required>
        <input type="text" id="imageUrl" placeholder="Image URL" required>
        <button type="submit">Add Art</button>
    </form>

    <div id="gallery"></div>

    <div id="pagination">
        <button onclick="changePage(-1)">Previous</button>
        <span id="pageNumber">Page 1</span>
        <button onclick="changePage(1)">Next</button>
    </div>

    <script src="app.js"></script>

    <footer>
        <p>&copy; 2026 The Digital Museum. All rights reserved.</p>
    </footer>

    <div id="imageModal" class="modal">
            <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>
    <div id="editModal" class="modal">
        <div class="modal-content" style="background: #292524; padding: 25px; border: 1px solid #7f1d1d; color: #fef3c7; max-width: 400px; margin-top: 10%;">
            <h2>Edit Artwork</h2>
            <input type="text" id="editTitle" placeholder="Title" style="width: 100%; margin-bottom: 10px; padding: 8px;">
            <input type="text" id="editArtist" placeholder="Artist" style="width: 100%; margin-bottom: 10px; padding: 8px;">
            <input type="number" id="editYear" placeholder="Year" style="width: 100%; margin-bottom: 10px; padding: 8px;">
            <input type="text" id="editImageUrl" placeholder="Image URL" style="width: 100%; margin-bottom: 20px; padding: 8px;">  
            <button onclick="saveEdit()">Save Changes</button>
            <button onclick="closeEditModal()" style="background: #444;">Cancel</button>
        </div>
    </div>
</body>
</html>
